# Builds the Android and iOS apps (Capacitor) from the website code.
#
# Android has two apps from one Gradle project (productFlavors in android/app/build.gradle):
#   customer  pk.sastadawa.app       "Sasta Dawa Finder"          → SastaDawa.apk
#   business  pk.sastadawa.business  "Sasta Dawa for Pharmacies"  → SastaDawa-Pharmacies.apk
# iOS ships only the customer app.
#
# Always:   Android debug APKs for both apps (install on any phone to test), iOS simulator build.
# With the Android signing secrets: signed release AABs (upload to Google Play) + signed APKs,
#           published to the "android" GitHub release behind the website's /download page.
# With the Apple secrets:            signed iOS build uploaded straight to App Store Connect / TestFlight.
#
# Run it from the Actions tab ("Mobile apps" → Run workflow), or it runs on pushes to main
# that touch the app. Secrets and store setup: see MOBILE_APPS.md.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      upload_ios:
        description: 'Upload the iOS build to TestFlight (needs the Apple secrets)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'account.html'
      - 'terms.html'
      - 'privacy.html'
      - 'refund.html'
      - 'disclaimer.html'
      - 'pharmacy-terms.html'
      - 'delete-account.html'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'icons/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build_app.js'
      - 'scripts/ocr_assets.js'
      - '.github/workflows/mobile-apps.yml'

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKETING_VERSION: '1.0.0'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish the APK behind the website's download button
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Bundle web files into the Android project (both apps)
        run: |
          npm run build:app                              # www/ (customer) + www-business/
          npx cap sync android                           # www/ → app/src/main/assets (customer flavor)
          node scripts/build_app.js --android-flavors    # www-business/ → app/src/business/assets
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/business/assets/public/account.html
          grep -q '"pk.sastadawa.business"' android/app/src/business/assets/capacitor.config.json

      - name: Debug APKs (customer + business)
        working-directory: android
        env:
          SD_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleCustomerDebug assembleBusinessDebug --no-daemon

      - name: Release AAB + APK (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          SD_VERSION_CODE: ${{ github.run_number }}
          SD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SD_KEYSTORE_PATH"
          ./gradlew bundleCustomerRelease bundleBusinessRelease assembleCustomerRelease assembleBusinessRelease --no-daemon
          rm -f "$SD_KEYSTORE_PATH"

      - name: Publish APKs for the website's download page
        # Always the same links: https://github.com/<owner>/<repo>/releases/download/android/SastaDawa.apk
        #                    and .../releases/download/android/SastaDawa-Pharmacies.apk
        if: env.HAS_SIGNING == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk SastaDawa.apk
          cp android/app/build/outputs/apk/business/release/app-business-release.apk SastaDawa-Pharmacies.apk
          NOTES="Latest Android apps (version ${MARKETING_VERSION}, build ${{ github.run_number }}). SastaDawa.apk = Sasta Dawa Finder (medicine prices, for everyone). SastaDawa-Pharmacies.apk = Sasta Dawa for Pharmacies (pharmacies, clinics, NGOs, companies). Download on your phone and open the file to install."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "Sasta Dawa for Android" --notes "$NOTES" --latest
          else
            gh release create android --title "Sasta Dawa for Android" --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
          gh release upload android SastaDawa.apk SastaDawa-Pharmacies.apk --clobber

      - name: Collect files
        run: |
          mkdir -p out
          O=android/app/build/outputs
          V="${MARKETING_VERSION}-${{ github.run_number }}"
          cp $O/apk/customer/debug/app-customer-debug.apk "out/SastaDawa-$V-debug.apk"
          cp $O/apk/business/debug/app-business-debug.apk "out/SastaDawa-Pharmacies-$V-debug.apk"
          if [ -f $O/bundle/customerRelease/app-customer-release.aab ]; then
            cp $O/bundle/customerRelease/app-customer-release.aab "out/SastaDawa-$V-playstore.aab"
            cp $O/apk/customer/release/app-customer-release.apk "out/SastaDawa-$V-release.apk"
          fi
          if [ -f $O/bundle/businessRelease/app-business-release.aab ]; then
            cp $O/bundle/businessRelease/app-business-release.aab "out/SastaDawa-Pharmacies-$V-playstore.aab"
            cp $O/apk/business/release/app-business-release.apk "out/SastaDawa-Pharmacies-$V-release.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bundle web files into the iOS project (customer app only)
        run: |
          npm run build:app
          npx cap sync ios

      - name: Simulator build (no signing; checks the app compiles)
        if: env.HAS_APPLE != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" && zip -qry "$GITHUB_WORKSPACE/SastaDawa-simulator.app.zip" App.app

      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE != 'true'
        with:
          name: ios-simulator-${{ github.run_number }}
          path: SastaDawa-simulator.app.zip

      - name: Archive, sign and upload to TestFlight
        if: env.HAS_APPLE == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_ios)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # ASC_KEY_P8 = the full text of the AuthKey_XXXX.p8 file from App Store Connect.
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect. It shows up in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
