apply plugin: 'com.android.application'

android {
    namespace = "pk.sastadawa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.sastadawa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the GitHub run number so every Play Store upload gets a higher versionCode.
        versionCode((System.getenv("SD_VERSION_CODE") ?: "1").toInteger())
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Store the OCR language model (vendor/ocr/eng.traineddata, ~4 MB) and wasm as-is in the APK:
    // the WebView reads them straight from the asset file instead of inflating them on every scan.
    // (aapt un-gzips *.gz assets and drops the ".gz"; scripts/ocr_assets.js ships the plain file for that.)
    androidResources {
        noCompress 'traineddata', 'wasm'
    }
    // Release signing (upload key for Google Play). Set by the GitHub workflow from repository
    // secrets, or locally: export SD_KEYSTORE_PATH, SD_KEYSTORE_PASSWORD, SD_KEY_ALIAS, SD_KEY_PASSWORD.
    def ks = System.getenv("SD_KEYSTORE_PATH")
    signingConfigs {
        if (ks && file(ks).exists()) {
            release {
                storeFile file(ks)
                storePassword System.getenv("SD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SD_KEY_ALIAS")
                keyPassword System.getenv("SD_KEY_PASSWORD") ?: System.getenv("SD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (ks && file(ks).exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Two apps from one project (scripts/build_app.js builds their web files):
    //  customer: the existing app (keep its applicationId so updates install over it)
    //  business: the pharmacy / clinic / company portal
    // Each has its own name, deep-link scheme (login handoff from the browser, js/native.js) and
    // web assets: `npx cap sync android` fills src/main/assets (customer only), and
    // `node scripts/build_app.js --android-flavors` fills src/business/assets.
    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "pk.sastadawa.app"
            resValue "string", "app_name", "Sasta Dawa Finder"
            resValue "string", "title_activity_main", "Sasta Dawa Finder"
            manifestPlaceholders = [authScheme: "sastadawa"]
        }
        business {
            dimension "app"
            applicationId "pk.sastadawa.business"
            resValue "string", "app_name", "Sasta Dawa for Pharmacies"
            resValue "string", "title_activity_main", "Sasta Dawa for Pharmacies"
            manifestPlaceholders = [authScheme: "sastadawabiz"]
        }
    }
    sourceSets {
        // Web assets are per flavor, never shared through main (so the apps cannot mix files).
        main { assets.srcDirs = [] }
        customer { assets.srcDirs = ['src/main/assets'] }
        business { assets.srcDirs = ['src/business/assets'] }
    }
}

// Fail early with a clear message when the web files were not copied in.
tasks.configureEach { t ->
    def m = (t.name =~ /^merge(Customer|Business)(Debug|Release)Assets$/)
    if (m.matches()) {
        def flavor = m.group(1).toLowerCase()
        def dir = flavor == 'business' ? 'src/business/assets' : 'src/main/assets'
        def index = file("${dir}/public/index.html")
        def config = file("${dir}/capacitor.config.json")
        t.doFirst {
            if (!index.exists() || !config.exists()) {
                throw new GradleException("Web files for the ${flavor} app are missing in android/app/${dir}. " +
                    "Run: npm run build:app && npx cap sync android && node scripts/build_app.js --android-flavors")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
