<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Medical Pill / Capsule Illustration -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Bottom half capsule (white) -->
    <path d="M196,160 L316,160 A60,60 0 0,1 316,280 L196,280 A60,60 0 0,1 196,160 Z" fill="#ffffff" opacity="0.95" />
    <!-- Top half capsule (emerald accent) -->
    <path d="M196,280 L316,280 A60,60 0 0,1 316,400 L196,400 A60,60 0 0,1 196,280 Z" fill="#34d399" />
    <!-- Pill divider line -->
    <line x1="196" y1="280" x2="316" y2="280" stroke="#059669" stroke-width="6" />
    <!-- Medical Cross on top half -->
    <rect x="246" y="315" width="20" height="50" rx="4" fill="#ffffff" />
    <rect x="231" y="330" width="50" height="20" rx="4" fill="#ffffff" />
  </g>

  <!-- Sparkle badge for savings -->
  <circle cx="390" cy="120" r="32" fill="#fcd34d" />
  <path d="M390,98 L395,115 L412,120 L395,125 L390,142 L385,125 L368,120 L385,115 Z" fill="#b45309" />
</svg>
